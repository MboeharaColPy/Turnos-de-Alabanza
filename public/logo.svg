<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="musicLogoGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5cc" />
      <stop offset="30%" stop-color="#eec76b" />
      <stop offset="70%" stop-color="#c5a059" />
      <stop offset="100%" stop-color="#805d15" />
    </linearGradient>
    <linearGradient id="musicLogoGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c5a059" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#c5a059" stop-opacity="0" />
    </linearGradient>
    <filter id="musicLogoGlowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g filter="url(#musicLogoGlowFilter)">
    <!-- Staff arcs -->
    <path d="M 80 160 C 130 110, 270 110, 320 160" stroke="url(#musicLogoGold)" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="4 6" />
    <path d="M 90 180 C 140 130, 260 130, 310 180" stroke="url(#musicLogoGold)" stroke-width="2" stroke-opacity="0.25" stroke-dasharray="4 6" />

    <!-- Musical Eighth Notes Pair -->
    <!-- Beam -->
    <path d="M 220 95 L 290 70 L 290 88 L 220 113 Z" fill="url(#musicLogoGold)" />
    <!-- Secondary Beam -->
    <path d="M 220 120 L 290 95 L 290 105 L 220 130 Z" fill="url(#musicLogoGold)" opacity="0.85" />

    <!-- Stem 1 -->
    <rect x="220" y="105" width="9" height="110" rx="4.5" fill="url(#musicLogoGold)" />
    <!-- Note Head 1 -->
    <ellipse cx="208" cy="215" rx="22" ry="16" transform="rotate(-25 208 215)" fill="url(#musicLogoGold)" />

    <!-- Stem 2 -->
    <rect x="281" y="80" width="9" height="110" rx="4.5" fill="url(#musicLogoGold)" />
    <!-- Note Head 2 -->
    <ellipse cx="269" cy="190" rx="20" ry="15" transform="rotate(-25 269 190)" fill="url(#musicLogoGold)" />

    <!-- Treble Clef Emblem Silhouette -->
    <path
      d="M 160 270
         C 145 270 132 258 132 240
         C 132 222 147 212 162 218
         C 170 221 175 229 175 238
         C 175 253 164 260 152 260
         M 160 270
         L 160 85
         C 160 48 178 32 188 32
         C 197 32 201 44 196 64
         C 190 88 167 132 152 170
         C 130 224 100 244 100 198
         C 100 148 148 125 180 148
         C 205 167 209 202 190 228
         C 175 248 145 248 132 235"
      fill="none"
      stroke="url(#musicLogoGold)"
      stroke-width="11"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <circle cx="160" cy="270" r="10" fill="url(#musicLogoGold)" />

    <!-- Top Star Sparkle -->
    <path d="M 188 16 Q 188 28 196 28 Q 188 28 188 40 Q 188 28 180 28 Q 188 28 188 16 Z" fill="#ffffff" />
    <circle cx="188" cy="28" r="3" fill="url(#musicLogoGold)" />
  </g>
</svg>
