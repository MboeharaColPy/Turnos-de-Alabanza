<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181d"/>
      <stop offset="50%" stop-color="#0e0e11"/>
      <stop offset="100%" stop-color="#050507"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8ca84"/>
      <stop offset="50%" stop-color="#c5a059"/>
      <stop offset="100%" stop-color="#99752d"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c5a059" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#c5a059" stop-opacity="0"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with safe zone -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="488" height="488" rx="98" fill="none" stroke="#2a2a32" stroke-width="3"/>
  <circle cx="256" cy="256" r="180" fill="url(#glowGrad)"/>

  <!-- Icon Graphics: Worship / Music / Lyre & Cross Emblem (Centered with safe margin) -->
  <g transform="translate(256, 256) scale(1.15) translate(-256, -256)" filter="url(#goldGlow)">
    <!-- Outer Lyre / Harp Body -->
    <path d="M170 140 C170 140, 150 240, 180 320 C205 385, 307 385, 332 320 C362 240, 342 140, 342 140 C322 170, 300 180, 256 180 C212 180, 190 170, 170 140 Z" fill="none" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Central Cross & Strings -->
    <!-- Center Vertical Beam (Cross & String 1) -->
    <line x1="256" y1="120" x2="256" y2="368" stroke="url(#goldGrad)" stroke-width="10" stroke-linecap="round"/>
    <!-- Cross Horizontal Bar -->
    <line x1="206" y1="180" x2="306" y2="180" stroke="url(#goldGrad)" stroke-width="10" stroke-linecap="round"/>
    
    <!-- Harp Strings (Flanking) -->
    <line x1="220" y1="182" x2="220" y2="345" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.85" stroke-linecap="round"/>
    <line x1="292" y1="182" x2="292" y2="345" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.85" stroke-linecap="round"/>
    <line x1="190" y1="200" x2="200" y2="310" stroke="url(#goldGrad)" stroke-width="3" stroke-opacity="0.6" stroke-linecap="round"/>
    <line x1="322" y1="200" x2="312" y2="310" stroke="url(#goldGrad)" stroke-width="3" stroke-opacity="0.6" stroke-linecap="round"/>

    <!-- Decorative Top Crown & Accents -->
    <circle cx="256" cy="115" r="10" fill="url(#goldGrad)"/>
    <circle cx="170" cy="140" r="8" fill="url(#goldGrad)"/>
    <circle cx="342" cy="140" r="8" fill="url(#goldGrad)"/>
    <circle cx="256" cy="378" r="7" fill="url(#goldGrad)"/>
  </g>
</svg>
