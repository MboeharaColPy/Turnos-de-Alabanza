name: Generar APK para Android

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Permite presionar un botón manual en GitHub para generar el APK

permissions:
  contents: read

jobs:
  build:
    name: Compilar APK de Android
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias del proyecto
        run: npm ci

      - name: Compilar la aplicación web (React + Vite)
        run: npm run build

      - name: Inicializar y sincronizar Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Dar permisos de ejecución a Gradle
        run: chmod +x android/gradlew

      - name: Compilar APK (Debug)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Subir APK para descargar
        uses: actions/upload-artifact@v4
        with:
          name: Gestor-de-Turnos-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
