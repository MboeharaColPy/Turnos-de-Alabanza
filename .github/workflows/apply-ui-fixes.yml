name: Apply UI fixes

on:
  push:
    paths:
      - '.github/workflows/apply-ui-fixes.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply source changes
        shell: python
        run: |
          from pathlib import Path
          def edit(path, fn):
              p=Path(path); old=p.read_text(encoding='utf-8'); new=fn(old)
              if new == old: raise SystemExit(f'No changes made to {path}')
              p.write_text(new, encoding='utf-8')
          def rep(t,o,n,label):
              if o not in t: raise SystemExit(f'Missing expected pattern: {label}')
              return t.replace(o,n,1)

          def app(t):
              t=rep(t,
                "  const [selectedSongForLyrics, setSelectedSongForLyrics] = useState<SongItem | null>(null);\n",
                "  const [selectedSongForLyrics, setSelectedSongForLyrics] = useState<SongItem | null>(null);\n  const [selectedSongContext, setSelectedSongContext] = useState<SongItem[] | null>(null);\n\n  const handleSelectSong = useCallback((song: SongItem, contextSongs?: SongItem[]) => {\n    setSelectedSongForLyrics(song);\n    setSelectedSongContext(contextSongs && contextSongs.length > 0 ? contextSongs : null);\n  }, []);\n",
                'song context')
              t=rep(t,
                "  const handleToggleTheme = () => {\n    setTheme(prev => {\n      const next = prev === 'dark' ? 'light' : 'dark';\n      localStorage.setItem('alabanza_theme', next);\n      return next;\n    });\n  };\n",
                "  const handleToggleTheme = () => {\n    setTheme(prev => {\n      const next = prev === 'dark' ? 'light' : 'dark';\n      localStorage.setItem('alabanza_theme', next);\n      return next;\n    });\n  };\n\n  useEffect(() => {\n    document.body.classList.toggle('light-theme', theme === 'light');\n    document.documentElement.style.colorScheme = theme;\n  }, [theme]);\n",
                'theme sync')
              t=rep(t,
                "  const handleAdminLogin = (e: React.FormEvent) => {\n    e.preventDefault();\n    const correctPassword = state.adminPassword || 'alabanza2026';\n    if (adminPasswordInput === correctPassword || adminPasswordInput === '1234' || adminPasswordInput === 'admin') {",
                "  const handleAdminLogin = (e: React.FormEvent) => {\n    e.preventDefault();\n    const correctPassword = (state.adminPassword || '').trim();\n    if (correctPassword && adminPasswordInput.trim() === correctPassword) {",
                'strict admin password')
              t=rep(t,
                "  const handleUpdateAdminPassword = (newPassword: string) => {\n    updateStateAndSave(prev => ({\n      ...prev,\n      adminPassword: newPassword,\n    }));\n    showToast('¡Contraseña de administrador actualizada con éxito!');\n  };\n",
                "  const handleUpdateAdminPassword = async (newPassword: string) => {\n    const clean = newPassword.trim();\n    if (!isAdmin || clean.length < 6) { showToast('La nueva contraseña debe tener al menos 6 caracteres.'); return; }\n    const nextState = { ...state, adminPassword: clean };\n    setState(nextState);\n    saveStoredState(nextState);\n    await saveCloudState(nextState);\n    showToast('¡Contraseña de administrador actualizada y guardada!');\n  };\n",
                'password save')
              t=t.replace("onSelectSong={song => setSelectedSongForLyrics(song)}","onSelectSong={handleSelectSong}")
              t=rep(t,
                "          onClose={() => setSelectedSongForLyrics(null)}\n",
                "          onClose={() => { setSelectedSongForLyrics(null); setSelectedSongContext(null); }}\n",
                'modal close')
              t=rep(t,
                "          allSongs={state.songCatalog || []}\n",
                "          allSongs={selectedSongContext || state.songCatalog || []}\n",
                'contextual allSongs')
              return t
          edit('src/App.tsx', app)

          def month(t):
              return rep(t,"onClick={() => onSelectSong && onSelectSong(song)}","onClick={() => onSelectSong && onSelectSong(song, evt.songs)}",'calendar context')
          edit('src/components/MonthCalendarView.tsx', month)

          def css(t):
              if 'Extended light-theme coverage v2' in t: raise SystemExit('CSS patch already present')
              return t.rstrip()+r'''

/* Extended light-theme coverage v2 */
.light-theme .bg-\[\#0a0a0c\], .light-theme .bg-\[\#0e0e11\], .light-theme .bg-\[\#0f0f12\],
.light-theme .bg-\[\#121216\], .light-theme .bg-\[\#151518\], .light-theme .bg-\[\#1a1a1f\],
.light-theme .bg-\[\#222228\], .light-theme .bg-\[\#282830\] { background-color:#fff !important; }
.light-theme .border-\[\#222226\], .light-theme .border-\[\#2e2e36\],
.light-theme .border-\[\#33333d\], .light-theme .border-\[\#3b3b44\] { border-color:#d7dee8 !important; }
.light-theme .hover\:bg-\[\#151518\]:hover, .light-theme .hover\:bg-\[\#18181d\]:hover,
.light-theme .hover\:bg-\[\#18181c\]:hover, .light-theme .hover\:bg-\[\#222228\]:hover,
.light-theme .hover\:bg-\[\#232328\]:hover { background-color:#f1f5f9 !important; }
.light-theme .hover\:text-white:hover, .light-theme .hover\:text-\[\#e0e0e0\]:hover { color:#0f172a !important; }
.light-theme select option { background:#fff; color:#0f172a; }
.light-theme ::-webkit-scrollbar-thumb { background:#cbd5e1; }
.light-theme ::-webkit-scrollbar-thumb:hover { background:#94a3b8; }
'''
          edit('src/index.css', css)
          Path('.github/workflows/apply-ui-fixes.yml').unlink()
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/components/MonthCalendarView.tsx src/index.css
          git diff --cached --check
          git commit -m "fix: contextual songs, admin password and themes"
          git push
